[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-finance-tsfm"
version = "0.1.0"
description = "Synthetic-only pre-training for zero-shot realized-volatility forecasting"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "certifi>=2025.1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "torch>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
synthetic-finance-tsfm = "synthetic_finance_tsfm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
