experiment:
  name: full_four_prior_comparison
  output_dir: runs/full
  seed: 42
  priors: [generic, volatility, regime_tail, mixed]
  train_samples: 200000
  validation_samples: 20000
  series_length: 640

data:
  context_length: 512
  horizons: [1, 5, 22]
  epsilon: 1.0e-10

model:
  patch_length: 16
  patch_stride: 8
  num_hidden_layers: 12
  d_model: 256
  num_attention_heads: 8
  ffn_dim: 1024
  dropout: 0.1

training:
  batch_size: 64
  optimizer_steps: 100000
  learning_rate: 0.0001
  weight_decay: 0.01
  validation_interval: 1000
  device: auto

