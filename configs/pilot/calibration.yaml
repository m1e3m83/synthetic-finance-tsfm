experiment:
  name: medium_synthetic_calibration
  output_dir: runs/calibration
  seed: 17
  priors: [generic, volatility]
  train_samples: 2048
  validation_samples: 512
  series_length: 224

data:
  context_length: 128
  horizons: [1, 5, 22]
  epsilon: 1.0e-10

model:
  patch_length: 16
  patch_stride: 8
  num_hidden_layers: 2
  d_model: 64
  num_attention_heads: 4
  ffn_dim: 128
  dropout: 0.0

training:
  batch_size: 32
  optimizer_steps: 500
  learning_rate: 0.001
  weight_decay: 0.001
  validation_interval: 50
  device: cpu

